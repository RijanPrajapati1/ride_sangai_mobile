# Optional: run Postgres (and the API) in Docker instead of a local install.
#   docker compose up -d db            # just the database on localhost:5432
#   docker compose up --build          # database + API on localhost:4000
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ride_sangai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ride_sangai
      JWT_ACCESS_SECRET: change-me-to-a-long-random-string-at-least-32-chars
      PUBLIC_URL: http://localhost:4000
      DOCS_ENABLED: 'true'
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
